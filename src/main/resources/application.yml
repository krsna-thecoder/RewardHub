spring:
  application:
    name: benefit-activation-engine

  # ---- H2 in-memory database (demo) ----
  datasource:
    url: jdbc:h2:mem:benefitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ---- H2 web console (Boot 4: backed by the spring-boot-h2console module) ----
  h2:
    console:
      enabled: true
      path: /h2-console

# ---- Actuator: expose health + info ----
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ---- Swagger / OpenAPI ----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
